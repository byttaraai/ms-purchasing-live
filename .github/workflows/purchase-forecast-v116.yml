name: Verify Purchase Forecast annual UI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  annual-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Forecast UI contracts and legacy protection
        run: node --test tests/purchase-forecast-v116.cjs tests/reorder-compact.cjs tests/reorder-preview-v103.cjs
      - name: JavaScript syntax
        run: node --check assets/js/purchase-forecast-v116.js
