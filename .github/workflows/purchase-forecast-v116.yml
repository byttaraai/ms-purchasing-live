name: Verify Purchase Forecast annual UI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  annual-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Forecast UI contracts and legacy protection
        run: node --test tests/purchase-forecast-v116.cjs tests/reorder-compact.cjs tests/purchase-forecast-toolbar-v119.cjs tests/purchase-forecast-clean-v120.cjs tests/purchase-forecast-source-v125.cjs
      - name: JavaScript syntax
        run: node --check assets/js/purchase-forecast-v116.js
      - name: Real desktop/mobile browser interaction smoke test
        run: |
          python3 -m pip install --disable-pip-version-check 'playwright==1.57.0' 'pyee==13.0.1' 'greenlet==3.5.1'
          python3 tests/run-purchase-forecast-v116.py
      - name: Retain synthetic UI screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: forecast-source-v125-screenshots
          path: |
            tests/forecast-toolbar-v119-*.png
            tests/forecast-v116-*.png
            tests/forecast-source-v125-*.png
          if-no-files-found: ignore
          retention-days: 7
