name: Prepare TASK01 once
on:
  push:
    branches: [fix/task01-attention-completion]
    paths: ['.task01-pending.sql', '.github/workflows/prepare-task01-once.yml', 'tests/run-recovery-attention-task01.py', 'tests/fixtures/recovery-attention-task01.sql']
permissions:
  contents: write
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: synthetic-task01
          POSTGRES_DB: task01_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - name: Generate and test content only - no production credentials
        env:
          TASK01_ISOLATED: '1'
        run: |
          npx --yes supabase@2.81.3 --version
          npx --yes supabase@2.81.3 migration new --help
          npx --yes supabase@2.81.3 migration new task01_nonblocking_attention_completion
          FILE=$(find supabase/migrations -maxdepth 1 -name '*_task01_nonblocking_attention_completion.sql')
          test $(printf '%s\n' "$FILE" | wc -l) -eq 1
          cp .task01-pending.sql "$FILE"
          python3 -m py_compile tests/run-recovery-attention-task01.py
          python3 tests/run-recovery-attention-task01.py
          rm .task01-pending.sql
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$FILE" .task01-pending.sql
          git commit -m 'TASK01: generated and tested price/rating-only completion migration'
          git push origin HEAD:fix/task01-attention-completion
