name: Verify UI82 dialog lifecycle fix
on:
  push:
    branches: [work/supplier-quest-ui-82-lifecycle]
    paths: ['.github/workflows/fix-ui82-lifecycle.yml']
permissions:
  contents: write
jobs:
  fix:
    if: github.repository == 'byttaraai/ms-purchasing-live' && github.ref == 'refs/heads/work/supplier-quest-ui-82-lifecycle'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Apply guarded source fix and deterministic regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,subprocess
          p=Path('assets/js/supplier-task-v82.js')
          raw=p.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()=='f95ca566ff614d0de8cb31dbde48534564a1893d','Source changed'
          s=raw.decode()
          old="  d.onclose=()=>{document.body.classList.remove('sq-modal-open');SupplierQuestUI.request++;SupplierQuestUI.returnFocus?.focus?.();sqUpdateTaskButtons();};"
          new="  // A queued close from the previous opening must not cancel the reopened dialog's save.\n  d.onclose=()=>{if(d.open)return;document.body.classList.remove('sq-modal-open');SupplierQuestUI.request++;SupplierQuestUI.returnFocus?.focus?.();sqUpdateTaskButtons();};"
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          p=Path('tests/browser-v82.py');s=p.read_text()
          old="  qaFailSave=true;await save();check(document.querySelector('#supplierTaskDialog [role=\"alert\"]')?.textContent.includes('QA simulated'),'Save error not visible');check(SupplierQuestUI.selected.size===2,'Failed save lost selections');"
          new="""  // Deterministically deliver a delayed close event from the previous opening during this save.
            // A native dialog close event can be queued until after the same element is reopened.
            qaFailSave=true;const pendingSave=save();dialog.dispatchEvent(new Event('close'));await pendingSave;
            check(document.body.classList.contains('sq-modal-open'),'Stale close unlocked the reopened modal background');
            check(!qaFailSave,'Simulated failure was not exercised');
            check(document.querySelector('#supplierTaskDialog [role=\"alert\"]')?.textContent.includes('QA simulated'),'Save error not visible');
            check(!SupplierQuestUI.busy&&!document.getElementById('supplierQuestPrimary').disabled,'Failed save did not restore controls');
            check(SupplierQuestUI.selected.size===2,'Failed save lost selections');"""
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed=={'assets/js/supplier-task-v82.js','tests/browser-v82.py'},changed
          PY
      - name: Regression and full browser journeys with delayed close event
        run: |
          node --check assets/js/supplier-task-v82.js
          node tests/workspace-v47.cjs .
          node --test tests/overstock-v69.cjs tests/supplier-quest-v79.cjs tests/supplier-quest-v80.cjs tests/supplier-quest-v81.cjs tests/supplier-quest-ux-v82.cjs
          python3 -m pip install --disable-pip-version-check 'playwright==1.57.0' 'pyee==13.0.1' 'greenlet==3.5.1'
          python3 tests/browser-v69.py
          python3 tests/browser-v82.py
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/workspace-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER; rm -f smoke.html quest-smoke.html quest-qa.html' EXIT
          sleep 1
          python3 tests/run-browser-v82.py
          python3 tests/run-browser-v82.py
      - name: Commit only verified fix and remove this temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/js/supplier-task-v82.js tests/browser-v82.py
          git rm -- .github/workflows/fix-ui82-lifecycle.yml
          git commit -m 'Build 82: ignore delayed close events after dialog reopen; exercise save error deterministically'
          git push origin HEAD:refs/heads/work/supplier-quest-ui-82-lifecycle
