name: Verify live main
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'tests/**'
      - 'supabase/**'
      - '.github/workflows/workspace-v47.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'tests/**'
      - 'supabase/**'
      - '.github/workflows/workspace-v47.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Static and workspace regression tests
        run: |
          test -s assets/css/app-v57.css
          test -s assets/css/task-assistant-v90.css
          test -s assets/css/task-assistant-v91.css
          test -s assets/css/task-assistant-v92.css
          grep -q "Live Build 92" index.html
          grep -q "build57_workspace_security_and_validation" supabase/MIGRATION_HISTORY.md
          grep -q "revoke execute on function public.purchasing_tasks_sync_v5" supabase/migrations/20260924154106_build57_workspace_security_and_validation.sql
          grep -q "purchasing_workspace_sync_v58" supabase/migrations/20260924161035_build58_server_authoritative_score_foundation.sql
          grep -q "workspace_task_impact_v60" supabase/migrations/20260924172132_build60_optimize_server_recalculation.sql
          grep -q "purchasing_supplier_action_v78" supabase/migrations/20260925220857_build78_supplier_action_tracking.sql
          grep -q "purchasing_supplier_quest_v79" supabase/migrations/20260926000018_build79_supplier_quest_workspace.sql
          grep -q "purchasing_supplier_quest_v80" supabase/migrations/20260926004934_build80_supplier_quest_reliability.sql
          grep -q "purchasing_supplier_quest_outputs_v80" supabase/migrations/20260926004934_build80_supplier_quest_reliability.sql
          grep -q "saved_rev is null or saved_rev<>current_revision" supabase/migrations/20260926005528_build80_supplier_quest_legacy_reconfirm.sql
          grep -q "supplier_quest_stage_stale_v81" supabase/migrations/20260926094306_build81_supplier_quest_stage_specific_reconfirm.sql
          grep -q "Unrelated master revisions do not invalidate completed stages" supabase/migrations/20260926094306_build81_supplier_quest_stage_specific_reconfirm.sql
          grep -q "profit_recovery_80_150" supabase/migrations/20260926163215_build89_profit_recovery_two_bands.sql
          grep -q "recovery|profit-80-150" supabase/migrations/20260926163215_build89_profit_recovery_two_bands.sql
          node --check assets/js/workspace-v47.js
          node --check assets/js/supplier-task-v78.js
          node --check assets/js/supplier-quest-model-v79.js
          node --check assets/js/supplier-task-v79.js
          node --check assets/js/supplier-quest-model-v80.js
          node --check assets/js/supplier-task-v80.js
          node --check assets/js/supplier-quest-model-v81.js
          node --check assets/js/supplier-task-v81.js
          node --check assets/js/supplier-task-v82.js
          node --check assets/js/supplier-layout-v83.js
          node --check assets/js/supplier-polish-v84.js
          node --check assets/js/supplier-toolbar-v85.js
          node --check assets/js/task-assistant-v86.js
          node --check assets/js/task-assistant-v87.js
          node --check assets/js/task-assistant-v88.js
          node --check assets/js/task-assistant-v91.js
          node --check assets/js/task-assistant-v92.js
          node tests/workspace-v47.cjs .
          node --test tests/overstock-v69.cjs
          node --test tests/supplier-quest-v79.cjs
          node --test tests/supplier-quest-v80.cjs
          node --test tests/supplier-quest-v81.cjs
          node --test tests/supplier-quest-ux-v82.cjs
          node --test tests/supplier-layout-v83.cjs
          node --test tests/supplier-polish-v84.cjs
          node --test tests/supplier-toolbar-v85.cjs
          node --test tests/task-assistant-v86.cjs
          node --test tests/task-assistant-v87.cjs
          node --test tests/task-assistant-v88.cjs
          node --test tests/task-assistant-v89.cjs
          node --test tests/task-assistant-v90.cjs
          node --test tests/task-assistant-v91.cjs
          node --test tests/task-assistant-v92.cjs
      - name: Browser smoke and full Supplier Quest journey - synthetic data only
        run: |
          python3 -m pip install --disable-pip-version-check 'playwright==1.57.0' 'pyee==13.0.1' 'greenlet==3.5.1'
          python3 tests/browser-v69.py
          python3 tests/browser-v82.py
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/workspace-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER; rm -f smoke.html quest-smoke.html quest-qa.html' EXIT
          sleep 1
          python3 tests/run-browser-v82.py
          python3 tests/run-layout-v83.py
          python3 tests/run-polish-v84.py
          python3 tests/run-toolbar-v85.py
