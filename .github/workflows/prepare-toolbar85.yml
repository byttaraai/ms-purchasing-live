name: Prepare verified toolbar85 wiring
on:
  push:
    branches: [work/supplier-table-toolbar-85]
    paths: ['.github/workflows/prepare-toolbar85.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Apply exact locally tested presentation-only wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          def verify(files):
              for path,expected in files.items():
                  assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==expected,path
          verify({
              'assets/js/supplier-toolbar-v85.js':'0880ec8332672dbaf8db12a60034ded82e09bab9e3164a4011cdff7f2187e0cc',
              'assets/css/supplier-toolbar-v85.css':'6fe58d7d92d0ac5825047571a7de003945c03bb031ec76ca23a79f57f4e97e54',
              'tests/run-toolbar-v85.py':'1394a21a998945eaa1a4aa3c631d4efe8143796367d737c6adbda8a925c25647',
              'tests/supplier-toolbar-v85.cjs':'7306c6b0dfbbbf0366c34213a29bdecff07b1bab4803daad3ce35abc07ac15bc',
              'docs/BUILD85_TABLE_TOOLBAR.md':'d2333b00d8c5e2456a4940f38a24d1eaebe49e87081de0286f379fa18d67f165'
          })
          def change(path,old,new):
              p=Path(path);s=p.read_text();assert s.count(old)==1,(path,old,s.count(old));p.write_text(s.replace(old,new))
          p=Path('index.html');s=p.read_text()
          css='<link rel="stylesheet" href="assets/css/supplier-polish-v84.css?v=84">'
          js='<script src="assets/js/supplier-polish-v84.js?v=84"></script>'
          assert s.count(css)==1 and s.count(js)==1 and 'Live Build 84' in s
          s=s.replace(css,css+'\n<link rel="stylesheet" href="assets/css/supplier-toolbar-v85.css?v=85">').replace(js,js+'<script src="assets/js/supplier-toolbar-v85.js?v=85"></script>')
          p.write_text(s.replace('Live Build 84','Live Build 85').replace('Build 84 |','Build 85 |'))
          old=" let html=fs.readFileSync(path.join(root,'index.html'),'utf8');"
          new=old+"\n html=html.replace('\\n<link rel=\"stylesheet\" href=\"assets/css/supplier-toolbar-v85.css?v=85\">','').replace('<script src=\"assets/js/supplier-toolbar-v85.js?v=85\"></script>','').replaceAll('Live Build 85','Live Build 84').replaceAll('Build 85 |','Build 84 |');"
          change('tests/supplier-quest-ux-v82.cjs',old,new)
          for file in ['tests/supplier-polish-v84.cjs','tests/supplier-layout-v83.cjs']:
              change(file,"index.includes('Live Build 84')","index.includes('Live Build 85')")
          change('tests/workspace-v47.cjs',"assert(html.includes('Live Build 84'));","assert(html.includes('Live Build 85'));assert(html.includes('supplier-toolbar-v85.js?v=85'));assert(html.includes('supplier-toolbar-v85.css?v=85'));")
          change('tests/run-layout-v83.py',"assert page.locator('.sq83-controls #supplierQuestSearch').count()==1","assert page.locator('.sq83-workspace .sq-stage-title #supplierQuestSearch').count()==1")
          old="                page.locator('#supplierQuestSearch').fill('Critical A')"
          new="                if width<980:\n                    page.keyboard.press('Escape')\n                    assert page.locator('.sq83-controls').evaluate('(el)=>el.inert')\n                    assert page.locator('#supplierQuestControlsToggle').evaluate('(el)=>el===document.activeElement')\n                toggle=page.locator('#supplierQuestFilterToggle')\n                if toggle.is_visible(): toggle.click()\n                page.locator('#supplierQuestSearch').fill('Critical A')"
          change('tests/run-layout-v83.py',old,new)
          old="                if width<980:\n                    page.keyboard.press('Escape')\n                    assert page.locator('#supplierTaskDialog').is_visible()\n                    assert page.locator('.sq83-controls').evaluate('(el)=>el.inert')\n                    assert page.locator('#supplierQuestControlsToggle').evaluate('(el)=>el===document.activeElement')"
          new="                if toggle.is_visible():\n                    page.keyboard.press('Escape')\n                    assert page.locator('#supplierTaskDialog').is_visible()\n                    assert page.locator('#supplierQuestTableTools').evaluate('(el)=>el.inert')\n                    assert toggle.evaluate('(el)=>el===document.activeElement')"
          change('tests/run-layout-v83.py',old,new)
          old="                    assert page.locator('[data-quest-stage=\"summary\"]').bounding_box()['y']<page.locator('#supplierQuestSearch').bounding_box()['y']\n                    assert page.locator('#supplierQuestSearch').bounding_box()['y']+32<page.locator('.sq-footer').bounding_box()['y']"
          new="                    assert page.locator('.sq83-workspace .sq-stage-title #supplierQuestSearch').count()==1\n                    assert page.locator('.sq83-controls #supplierQuestSearch').count()==0"
          change('tests/run-polish-v84.py',old,new)
          verify({
              'index.html':'5d6700f0fc357b15a8d46226903c7c975a1622ea677804f1545663171335bf55',
              'tests/supplier-quest-ux-v82.cjs':'e61205f44889df07e7f91c43aef714104f670ba5b82f35d8965cbfc480e8b02c',
              'tests/supplier-polish-v84.cjs':'c3e134324e440855e4485e39d514e3e9380b436b2f03fa8a5cd9f3b4a000c114',
              'tests/supplier-layout-v83.cjs':'605fde635cb5a3d467972c4538e9ba700ea39e90f52d744d57fead5e653cee29',
              'tests/workspace-v47.cjs':'74791fa662bab021c75e3c8a2c3d54d33c76aabbbc8836d2915904e7d61a12a7',
              'tests/run-layout-v83.py':'9942fd161517b54e6a8cd655d9a86aae2c260914725d4823e37debb65fdfe8b6',
              'tests/run-polish-v84.py':'a76b69c7676742829ade1ee08b80ff4189f83852f871a80dc7cb64c260b7907a'
          })
          PY
      - name: Verify full synthetic employee journeys and toolbar input
        run: |
          node --check assets/js/supplier-toolbar-v85.js
          node tests/workspace-v47.cjs .
          node --test tests/overstock-v69.cjs tests/supplier-quest-v79.cjs tests/supplier-quest-v80.cjs tests/supplier-quest-v81.cjs tests/supplier-quest-ux-v82.cjs tests/supplier-layout-v83.cjs tests/supplier-polish-v84.cjs tests/supplier-toolbar-v85.cjs
          python3 -m pip install --disable-pip-version-check 'playwright==1.57.0' 'pyee==13.0.1' 'greenlet==3.5.1'
          python3 tests/browser-v69.py
          python3 tests/browser-v82.py
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/toolbar85-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER; rm -f smoke.html quest-smoke.html quest-qa.html' EXIT
          sleep 1
          python3 tests/run-browser-v82.py
          python3 tests/run-layout-v83.py
          python3 tests/run-polish-v84.py
          python3 tests/run-toolbar-v85.py
      - name: Commit verified content wiring and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/prepare-toolbar85.yml
          git add index.html tests/supplier-quest-ux-v82.cjs tests/supplier-polish-v84.cjs tests/supplier-layout-v83.cjs tests/workspace-v47.cjs tests/run-layout-v83.py tests/run-polish-v84.py
          git commit -m 'Build 85: wire verified table tools while retaining business source unchanged'
          git push origin HEAD:work/supplier-table-toolbar-85
