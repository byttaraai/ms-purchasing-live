name: Prepare unit96 branch once
on:
  push:
    branches: [fix/unit96-new-product-conversion]
    paths: ['.github/workflows/prepare-unit96-once.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/unit96-new-product-conversion
      - name: Generate checked assets and a CLI-created migration file
        run: |
          python3 .prepare-unit96.py
          npx --yes supabase@2.81.3 --version
          npx --yes supabase@2.81.3 migration --help
          npx --yes supabase@2.81.3 migration new --help
          npx --yes supabase@2.81.3 migration new master_review_units_v96
          MIGRATION=$(find supabase/migrations -name '*_master_review_units_v96.sql')
          test -n "$MIGRATION"
          cp .unit96-candidate.sql "$MIGRATION"
          echo "CLI_MIGRATION=$MIGRATION"
          node --check assets/js/task-assistant-v96.js
          node --test tests/units-v96.cjs tests/popup-drafts-v95.cjs tests/numeric-data01.cjs tests/task-assistant-v93.cjs tests/admin-guard-fix1.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/task-assistant-v96.js index.html tests/admin-guard-fix1.cjs tests/numeric-data01.cjs tests/popup-drafts-v95.cjs tests/task-assistant-v93.cjs "$MIGRATION"
          git commit -m 'Build 96: wire verified new-product unit controls and migration source'
          git push origin HEAD:fix/unit96-new-product-conversion
