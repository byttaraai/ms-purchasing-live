name: Prepare SEC03 once
on:
  push:
    branches: [review/sec03-restore-rehearsal]
    paths: ['maintenance/prepare-sec03-retirement.py', 'maintenance/sec03_restore_rehearsal.sql', 'tests/run-legacy-retirement-sec03.py', '.github/workflows/prepare-sec03-once.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: synthetic-sec03
          POSTGRES_DB: sec03_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - name: Generate and validate SQL with synthetic data only
        env:
          SEC03_ISOLATED: '1'
        run: |
          python3 maintenance/prepare-sec03-retirement.py
          python3 tests/run-legacy-retirement-sec03.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations/*_security_fix3_retire_legacy_tables.sql maintenance/sec03_restore_retired.sql
          git commit -m 'SEC03: CLI-generated retirement and tested owner-only recovery'
          git push origin HEAD:review/sec03-restore-rehearsal
