name: Prepare risk 69 on development branch
on:
  push:
    branches: [work/overstock-risk-root-69]
    paths:
      - '.github/workflows/prepare-risk-69.yml'
permissions:
  contents: write
concurrency:
  group: prepare-risk-69
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/work/overstock-risk-root-69'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: work/overstock-risk-root-69
      - name: Apply one-time hash-guarded source patch
        run: python3 maintenance/prepare69.py
      - name: Verify purchasing and new risk regressions
        run: |
          node tests/workspace-v47.cjs .
          node --test tests/overstock-v69.cjs
      - name: Browser regression using synthetic data only
        run: |
          python3 tests/browser-v69.py
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/workspace-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER; rm -f smoke.html' EXIT
          sleep 1
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          timeout 35s "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=1440,1000 --virtual-time-budget=15000 --dump-dom http://127.0.0.1:8765/smoke.html > /tmp/workspace-smoke.html 2>/tmp/workspace-chrome.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/workspace-smoke.html').read_text()
          m=re.search(r'<p id="workspace-smoke-result">([^<]+)</p>',s)
          print(m.group(1) if m else 'FAIL: browser test did not finish')
          assert m and m.group(1).startswith('PASS:'), 'Browser smoke test failed'
          PY
      - name: Commit verified integration to development branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tests/workspace-v47.cjs
          git diff --cached --stat
          git commit -m 'Build 69: integrate verified unified overstock risk'
          git push origin HEAD:work/overstock-risk-root-69
