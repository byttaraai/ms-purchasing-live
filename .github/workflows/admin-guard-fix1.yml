name: Verify admin guard fix 1
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  patch-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Static authorization patch and protected-engine contracts
        run: node --test tests/admin-guard-fix1.cjs
