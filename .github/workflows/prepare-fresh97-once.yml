name: Prepare freshness97 branch once
on:
  push:
    branches: ['fix/freshness97-master-review']
    paths: ['.github/workflows/prepare-fresh97-once.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/freshness97-master-review
      - name: Generate tested asset and CLI-created migration (no production access)
        run: |
          python3 .prepare-fresh97.py
          npx --yes supabase@2.81.3 --version
          npx --yes supabase@2.81.3 migration --help
          npx --yes supabase@2.81.3 migration new --help
          npx --yes supabase@2.81.3 migration new master_review_freshness_v97
          MIGRATION=$(find supabase/migrations -name '*_master_review_freshness_v97.sql')
          test -n "$MIGRATION"
          cp .freshness97-candidate.sql "$MIGRATION"
          echo "CLI_MIGRATION=$MIGRATION"
          node --check assets/js/task-assistant-v97.js
          node --test tests/freshness-v97.cjs tests/units-v96.cjs tests/popup-drafts-v95.cjs tests/numeric-data01.cjs tests/task-assistant-v93.cjs tests/admin-guard-fix1.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/task-assistant-v97.js index.html tests/admin-guard-fix1.cjs tests/numeric-data01.cjs tests/popup-drafts-v95.cjs tests/units-v96.cjs tests/task-assistant-v93.cjs "$MIGRATION"
          git commit -m 'Build 97: wire verified freshness gate and immutable migration source'
          git push origin HEAD:fix/freshness97-master-review
