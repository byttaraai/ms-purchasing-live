name: Prepare verified Build125 feature patch
on:
  push:
    branches: [build125-sales-source-in-place]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'byttaraai/ms-purchasing-live' && github.ref == 'refs/heads/build125-sales-source-in-place'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: build125-sales-source-in-place
          fetch-depth: 3
      - name: Verify and apply locally tested content patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code d4c24318cc5c50e3b85905be7981930f1bb5c12d HEAD -- index.html assets tests supabase docs
          python3 - <<'PY'
          import hashlib,lzma,pathlib,subprocess
          raw=b''.join(pathlib.Path('.build125/part'+str(i)+'.bin').read_bytes() for i in range(4))
          patch=lzma.decompress(raw)
          assert hashlib.sha256(patch).hexdigest()=='3fc3afafb63cf3258cd964d20bd07900b0d2a7af18abe58c7b4adaa8b9fd7ba7'
          args=['--exclude=.github/workflows/purchase-forecast-v116.yml']
          subprocess.run(['git','apply','--check','--index']+args,input=patch,check=True)
          subprocess.run(['git','apply','--index']+args,input=patch,check=True)
          PY
          node --check assets/js/purchase-forecast-v116.js
          node --test tests/purchase-forecast-v116.cjs tests/reorder-compact.cjs tests/purchase-forecast-toolbar-v119.cjs tests/purchase-forecast-clean-v120.cjs tests/dashboard-inline-v122.cjs tests/purchase-forecast-source-v125.cjs
      - name: Commit only feature source files
        shell: bash
        run: |
          set -euo pipefail
          git rm .build125/part0.bin .build125/part1.bin .build125/part2.bin .build125/part3.bin
          test -z "$(git diff --cached --name-only -- .github)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Build 125: Read product names and monthly quantities from existing Forecast sales'
          git push origin HEAD:refs/heads/build125-sales-source-in-place
          git rev-parse HEAD
