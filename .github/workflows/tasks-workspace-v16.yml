name: Apply verified Tasks workspace v16
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tasks-workspace-v16.yml'
      - '.github/scripts/tasks_workspace_v16.py'
permissions:
  contents: write
concurrency:
  group: tasks-workspace-v16
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - name: Apply source-guarded presentation patch
        run: python .github/scripts/tasks_workspace_v16.py
      - name: Verify output matches the browser-tested file exactly
        run: |
          python -c "from pathlib import Path; import hashlib; assert hashlib.sha256(Path('index.html').read_bytes()).hexdigest() == '415cf05ebc8b30e56d452a16cd69cf1d25dd18f469f78aa29432ca1653b494e6', 'Output differs from tested file'"
          git diff --check
      - name: Commit only the verified application file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Group Tasks into supplier, product and master columns with compact stock strip'
          git push origin HEAD:main
