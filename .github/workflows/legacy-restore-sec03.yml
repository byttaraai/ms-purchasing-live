name: Verify SEC03 restore rehearsal
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  restore-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: synthetic-sec03
          POSTGRES_DB: sec03_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify unchanged Build 100 and scoped retirement contracts
        run: node --test tests/legacy-retirement-contracts-sec03.cjs
      - name: Full synthetic restore, retirement and owner-only recovery
        env:
          SEC03_ISOLATED: '1'
        run: |
          python3 -m py_compile tests/run-legacy-restore-sec03.py tests/run-legacy-retirement-sec03.py
          python3 tests/run-legacy-retirement-sec03.py
