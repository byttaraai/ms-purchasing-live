name: Prepare status98 branch once
on:
  push:
    branches: [fix/status98-master-review-colors]
    paths:
      - '.prepare-status98.py'
      - '.github/workflows/prepare-status98-once.yml'
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref == 'refs/heads/fix/status98-master-review-colors'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - name: Exact release wiring and static regressions - no database access
        run: |
          python3 .prepare-status98.py
          rm .prepare-status98.py .github/workflows/prepare-status98-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tests/admin-guard-fix1.cjs tests/numeric-data01.cjs tests/popup-drafts-v95.cjs tests/units-v96.cjs tests/freshness-v97.cjs tests/task-assistant-v93.cjs .github/workflows/workspace-v47.yml docs/BUILD98_MASTER_REVIEW_STATUS_COLORS.md .prepare-status98.py .github/workflows/prepare-status98-once.yml
          git commit -m 'Build 98: wire color-only stylesheet and preserve historical contracts'
          git push origin HEAD:fix/status98-master-review-colors
