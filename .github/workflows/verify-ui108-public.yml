name: Verify served UI108 static assets
on:
  push:
    branches: [verify/generator-ui108-public]
permissions: {}
jobs:
  public-static-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify deployed HTML CSS and JS with unauthenticated GET only
        run: |
          python3 - <<'PY'
          import hashlib,json,urllib.request
          base='https://byttaraai.github.io/ms-purchasing-live/'
          commit='a752634fca6b37dd58edc32663157a458de870de'
          expected=[('','c7ae2537fda374d8883b9c574eb27ccaec4c10c3'),('assets/css/reorder-generator-v108.css','323f6b45b3177525fdb456e60ce3fb1bb42373a4'),('assets/js/reorder-ux-v108.js','1a22666ed87a61595a20150dfa55e293caa42ab1')]
          evidence=[]
          for path,wanted in expected:
              request=urllib.request.Request(base+path+'?verify='+commit,headers={'Cache-Control':'no-cache'})
              with urllib.request.urlopen(request,timeout=30) as response:
                  data=response.read();status=response.status
              actual=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert status==200,(path,status)
              assert actual==wanted,(path,actual,wanted)
              evidence.append({'path':path or 'index.html','http':status,'bytes':len(data),'blob':actual})
          print('UI108_PUBLIC_VERIFIED='+json.dumps({'main':commit,'assets':evidence,'authenticated_requests':0,'business_data_access':False}))
          PY
