name: Polish verified Build128 compact labels
on:
  push:
    branches: [build128-forecast-sales-level]
    paths: ['.github/workflows/build128-materialize.yml']
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: build128-forecast-sales-level
      - name: Apply verified compact-label polish
        run: |
          set -euo pipefail
          test "$(git hash-object assets/css/purchase-forecast-v116.css)" = "7ce3863d29da7aef99b341196037dfe547b583a1"
          cat >> assets/css/purchase-forecast-v116.css <<'CSS'
          #purchaseForecast116 .pf-scroll table th:nth-child(6),#purchaseForecast116 .pf-scroll table td:nth-child(6){padding-left:6px;padding-right:6px}
          #purchaseForecast116 .pf-scroll table th:nth-child(6){white-space:nowrap;font-size:10px}
          #purchaseForecast116 .pf-scroll table td:nth-child(6) .pf-trend{padding:4px 5px;font-size:10px;overflow-wrap:normal}
          CSS
          node --test tests/purchase-forecast-v116.cjs
          git add assets/css/purchase-forecast-v116.css
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Build128: keep adjacent confidence labels readable on narrow desktop'
          git push origin HEAD:refs/heads/build128-forecast-sales-level
