name: Prepare TASK02 once
on:
  push:
    branches: [fix/task02-profit-range-100]
    paths: ['.prepare-task02.py', '.github/workflows/prepare-task02-once.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: synthetic-task01
          POSTGRES_DB: task01_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - name: Generate and test content-only patch without production credentials
        env:
          TASK02_EXPORT: '1'
          TASK02_ISOLATED: '1'
        run: |
          npx --yes supabase@2.81.3 --version
          npx --yes supabase@2.81.3 migration new --help
          npx --yes supabase@2.81.3 migration new task02_profit_recovery_range
          FILE=$(find supabase/migrations -maxdepth 1 -name '*_task02_profit_recovery_range.sql')
          test $(printf '%s\n' "$FILE" | wc -l) -eq 1
          cp .task02-pending.sql "$FILE"
          python3 .prepare-task02.py
          python3 tests/run-profit-range-task02.py
          python3 -m pip install --disable-pip-version-check 'playwright==1.57.0' 'pyee==13.0.1' 'greenlet==3.5.1'
          python3 tests/run-profit-range-browser-task02.py
          rm .task02-pending.sql .prepare-task02.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tests/release-negative-v99.cjs tests/task-assistant-v89.cjs "$FILE" .task02-pending.sql .prepare-task02.py
          git commit -m 'Build 100: expand upper Profit Recovery eligibility without changing orders'
          git push origin HEAD:fix/task02-profit-range-100
