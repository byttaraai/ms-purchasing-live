name: Prepare negative99 branch once
on:
  push:
    branches: [fix/negative-stock99-master-review]
    paths:
      - '.prepare-negative99.py'
      - '.github/workflows/prepare-negative99-once.yml'
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - name: Prepare and test content-only patch - no production requests
        run: |
          python3 .prepare-negative99.py
          rm .prepare-negative99.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/task-assistant-v99.js index.html tests/admin-guard-fix1.cjs tests/numeric-data01.cjs tests/popup-drafts-v95.cjs tests/units-v96.cjs tests/freshness-v97.cjs tests/task-assistant-v93.cjs tests/status-colors-v98.cjs .prepare-negative99.py
          git commit -m 'Build 99: negative stock warning for new products only'
          git push origin HEAD:fix/negative-stock99-master-review
